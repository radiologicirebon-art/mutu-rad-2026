<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Mutu Radiologi — RS Mitra Plumbon</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --teal: #2a9d8f;
  --teal-dark: #1a7a6e;
  --teal-light: #e8f7f5;
  --teal-mid: #b2e0da;
  --orange: #e07b39;
  --orange-light: #fdf0e8;
  --navy: #1a2e3b;
  --navy-mid: #243647;
  --slate: #4a6375;
  --gray-light: #f0f4f6;
  --gray-border: #d8e3e8;
  --white: #ffffff;
  --success: #22c55e;
  --warning: #f59e0b;
  --danger: #ef4444;
  --text: #1a2e3b;
  --text-muted: #64808f;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background: #eef2f5;
  color: var(--text);
  min-height: 100vh;
}

/* ── LOGIN ── */
#loginPage {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--navy) 0%, var(--teal-dark) 100%);
}

.login-card {
  background: var(--white);
  border-radius: 20px;
  padding: 48px 40px;
  width: 380px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.25);
}

.login-logo {
  width: 100%;
  max-width: 220px;
  display: block;
  margin: 0 auto 28px;
}

.login-card h2 {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 18px;
  color: var(--navy);
  text-align: center;
  margin-bottom: 24px;
  font-weight: 700;
}

.login-card .subtitle {
  font-size: 12px;
  color: var(--text-muted);
  text-align: center;
  margin-top: -16px;
  margin-bottom: 24px;
}

.field-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--slate);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.login-card input {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--gray-border);
  border-radius: 10px;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  margin-bottom: 16px;
  outline: none;
  transition: border-color 0.2s;
}

.login-card input:focus { border-color: var(--teal); }

.btn-primary {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, var(--teal), var(--teal-dark));
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
}

.btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }

/* ── LAYOUT ── */
#app { display: flex; min-height: 100vh; }

.sidebar {
  width: 260px;
  min-height: 100vh;
  background: var(--navy);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
  overflow-y: auto;
}

.sidebar-header {
  padding: 28px 22px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.sidebar-logo {
  width: 140px;
  filter: brightness(0) invert(1);
  margin-bottom: 10px;
}

.sidebar-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 11px;
  color: var(--teal-mid);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 600;
}

.sidebar-nav {
  padding: 20px 16px;
  flex: 1;
}

.nav-section-label {
  font-size: 10px;
  font-weight: 700;
  color: rgba(255,255,255,0.3);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 0 8px;
  margin: 16px 0 8px;
}

.nav-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 11px 14px;
  border: none;
  border-radius: 10px;
  background: transparent;
  color: rgba(255,255,255,0.7);
  cursor: pointer;
  font-size: 13.5px;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  text-align: left;
  transition: all 0.2s;
  margin-bottom: 3px;
}

.nav-btn:hover { background: rgba(42,157,143,0.25); color: white; }
.nav-btn.active { background: var(--teal); color: white; }

.nav-btn .icon { font-size: 16px; min-width: 20px; }

.sidebar-footer {
  padding: 16px 22px;
  border-top: 1px solid rgba(255,255,255,0.08);
}

.auditor-badge {
  font-size: 11px;
  color: rgba(255,255,255,0.5);
  line-height: 1.6;
}

.auditor-badge strong {
  display: block;
  color: rgba(255,255,255,0.85);
  font-size: 12px;
}

.btn-logout {
  margin-top: 12px;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 9px 10px;
  background: rgba(239,68,68,0.12);
  border: 1px solid rgba(239,68,68,0.35);
  color: #ffb4b0;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-logout:hover { background: rgba(239,68,68,0.22); color: #fff; }

/* ── ENHANCED STAT CARDS ── */
.stat-card {
  position: relative;
  overflow: hidden;
  cursor: default;
  transition: transform 0.2s, box-shadow 0.2s;
}
.stat-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(26,46,59,0.12); }
.stat-card .stat-icon {
  position: absolute;
  right: 14px;
  top: 14px;
  font-size: 26px;
  opacity: 0.18;
}
.stat-card.clickable { cursor: pointer; }

/* ── DOUGHNUT LEGEND ── */
.legend-list { margin-top: 14px; }
.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12.5px;
  color: var(--slate);
  padding: 6px 0;
  border-bottom: 1px dashed var(--gray-border);
}
.legend-item:last-child { border-bottom: none; }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.legend-name { flex: 1; font-weight: 600; color: var(--navy); }
.legend-val { font-weight: 700; color: var(--teal-dark); }

/* ── ARSIP PAGE ── */
.arsip-toolbar {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr 1fr auto;
  gap: 10px;
  align-items: end;
  margin-bottom: 16px;
}
.arsip-toolbar .form-group label { margin-bottom: 5px; }
.arsip-toolbar input,
.arsip-toolbar select {
  padding: 9px 11px;
  border: 1.5px solid var(--gray-border);
  border-radius: 8px;
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  background: white;
  color: var(--navy);
  outline: none;
  width: 100%;
}
.arsip-toolbar input:focus,
.arsip-toolbar select:focus { border-color: var(--teal); }

.btn-outline {
  padding: 9px 16px;
  border-radius: 8px;
  border: 1.5px solid var(--teal);
  background: white;
  color: var(--teal-dark);
  font-size: 12.5px;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.btn-outline:hover { background: var(--teal); color: white; }

.arsip-summary-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.arsip-chip {
  background: var(--gray-light);
  border: 1px solid var(--gray-border);
  padding: 7px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  color: var(--slate);
}
.arsip-chip strong { color: var(--navy); }

.arsip-table-wrap { overflow-x: auto; }
table.arsip-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
}
table.arsip-table th {
  background: var(--navy);
  color: white;
  text-align: left;
  padding: 10px 12px;
  font-weight: 700;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
table.arsip-table th:first-child { border-top-left-radius: 8px; }
table.arsip-table th:last-child { border-top-right-radius: 8px; }
table.arsip-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--gray-border);
  color: var(--navy);
  vertical-align: middle;
}
table.arsip-table tr:hover td { background: var(--teal-light); }
table.arsip-table .mini-btn {
  background: var(--teal-light);
  color: var(--teal-dark);
  border: 1px solid var(--teal-mid);
  padding: 5px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  margin-right: 4px;
}
table.arsip-table .mini-btn:hover { background: var(--teal); color: white; }
table.arsip-table .mini-btn.danger { background: #fee2e2; color: #991b1b; border-color: #fecaca; }
table.arsip-table .mini-btn.danger:hover { background: #ef4444; color: white; }
.arsip-empty {
  text-align: center;
  padding: 40px 10px;
  color: var(--text-muted);
  font-size: 13px;
}
.arsip-pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 16px;
}
.arsip-pagination button {
  padding: 6px 12px;
  border-radius: 8px;
  border: 1.5px solid var(--gray-border);
  background: white;
  color: var(--navy);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
.arsip-pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
.arsip-pagination button.active { background: var(--teal); color: white; border-color: var(--teal); }
.arsip-page-info { font-size: 12px; color: var(--text-muted); }

/* ── CONTENT ── */
.content {
  margin-left: 260px;
  flex: 1;
  padding: 28px;
  min-height: 100vh;
}

.page-header {
  margin-bottom: 24px;
}

.page-header h1 {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 24px;
  font-weight: 800;
  color: var(--navy);
}

.page-header p {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 4px;
}

/* ── CARDS ── */
.card {
  background: var(--white);
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 2px 12px rgba(26,46,59,0.07);
  margin-bottom: 20px;
}

.card-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ── STATS ROW ── */
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 20px;
}

.stat-card {
  background: var(--white);
  border-radius: 14px;
  padding: 20px;
  box-shadow: 0 2px 12px rgba(26,46,59,0.07);
  border-left: 4px solid var(--teal);
}

.stat-card.orange { border-left-color: var(--orange); }
.stat-card.danger { border-left-color: var(--danger); }
.stat-card.success { border-left-color: var(--success); }

.stat-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.07em;
}

.stat-value {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 28px;
  font-weight: 800;
  color: var(--navy);
  margin-top: 4px;
}

.stat-sub {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* ── CHART ── */
.chart-wrap {
  position: relative;
  height: 240px;
}

/* ── FILTER ── */
.filter-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.filter-bar label {
  font-size: 12px;
  font-weight: 600;
  color: var(--slate);
  white-space: nowrap;
}

.filter-bar select {
  padding: 9px 12px;
  border: 1.5px solid var(--gray-border);
  border-radius: 8px;
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  background: white;
  color: var(--navy);
  outline: none;
  cursor: pointer;
}

.filter-bar select:focus { border-color: var(--teal); }

/* ── REMINDER ── */
.reminder-banner {
  background: linear-gradient(135deg, #fff1f0, #ffe8e6);
  border: 1.5px solid #ffc9c9;
  border-radius: 12px;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
  font-size: 14px;
  font-weight: 600;
  color: #c0392b;
}

/* ── RANKING ── */
.ranking-item {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  border-radius: 10px;
  background: var(--gray-light);
  margin-bottom: 8px;
  gap: 12px;
}

.ranking-medal { font-size: 22px; min-width: 32px; }

.ranking-name {
  font-weight: 600;
  font-size: 14px;
  color: var(--navy);
  flex: 1;
}

/* ── DATA ITEMS ── */
.audit-item {
  border: 1.5px solid var(--gray-border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 10px;
  transition: box-shadow 0.2s;
}

.audit-item:hover { box-shadow: 0 4px 16px rgba(42,157,143,0.12); }

.audit-item-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.audit-type-badge {
  background: var(--teal-light);
  color: var(--teal-dark);
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.audit-meta {
  font-size: 13px;
  color: var(--slate);
  line-height: 1.8;
}

.audit-meta strong { color: var(--navy); }

.btn-cetak {
  background: var(--teal-light);
  color: var(--teal-dark);
  border: 1px solid var(--teal-mid);
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  margin-top: 8px;
  transition: all 0.2s;
}

.btn-cetak:hover { background: var(--teal); color: white; }

/* ── FORM ── */
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.form-group { display: flex; flex-direction: column; }

.form-group.full { grid-column: 1 / -1; }

.form-group label {
  font-size: 12px;
  font-weight: 600;
  color: var(--slate);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.form-group input,
.form-group textarea,
.form-group select {
  padding: 11px 13px;
  border: 1.5px solid var(--gray-border);
  border-radius: 10px;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
  background: white;
}

.form-group input:focus,
.form-group textarea:focus { border-color: var(--teal); }

.form-group textarea { height: 80px; resize: vertical; }

/* ── CHECKLIST ── */
.checklist-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 8px 0 20px;
}

.chk-label {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1.5px solid var(--gray-border);
  cursor: pointer;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--navy);
  transition: all 0.2s;
  background: var(--gray-light);
}

.chk-label:hover { border-color: var(--teal); background: var(--teal-light); }

.chk-label input[type="checkbox"] {
  width: 18px; height: 18px;
  accent-color: var(--teal);
  cursor: pointer;
  flex-shrink: 0;
}

/* ── STATUS BADGES ── */
.badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
}

.badge-green { background: #dcfce7; color: #166534; }
.badge-yellow { background: #fef9c3; color: #854d0e; }
.badge-red { background: #fee2e2; color: #991b1b; }

/* ── TWO COL LAYOUT ── */
.two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.hidden { display: none !important; }

/* ── PRINT ── */
@media print {
  body { background: white; }
  .sidebar, .content > .page-header { display: none; }
}
</style>
</head>

var AUTH_KEY = "audit_radiologi_session";

function login() {
  let user = document.getElementById("username").value;
  let pass = document.getElementById("password").value;
  if (user === "201708073" && pass === "Papamama00") {
    sessionStorage.setItem(AUTH_KEY, "1");
    enterApp();
  } else {
    alert("Username atau password salah.");
  }
}

function enterApp() {
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  showDashboard();
}

function logout() {
  if (!confirm("Yakin ingin keluar dari aplikasi?")) return;
  sessionStorage.removeItem(AUTH_KEY);
  document.getElementById("app").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");
  document.getElementById("username").value = "";
  document.getElementById("password").value = "";
}

// Auto-login jika sesi masih aktif (tidak keluar saat refresh halaman)
(function checkSession() {
  if (sessionStorage.getItem(AUTH_KEY) === "1") {
    window.addEventListener("DOMContentLoaded", enterApp);
  }
})();

function navClick(key, fn) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-' + key)?.classList.add('active');
  fn();
}

function badge(p) {
  p = parseFloat(p);
  if (p >= 95) return '<span class="badge badge-green">✔ ' + p + '%</span>';
  if (p >= 85) return '<span class="badge badge-yellow">⚠ ' + p + '%</span>';
  return '<span class="badge badge-red">✘ ' + p + '%</span>';
}

        document.querySelectorAll('.chk-label').forEach(lbl => {

function simpanAudit(jenis) {
  let radiografer = document.getElementById("radiografer").value;
  let unit = document.getElementById("unit").value;
  let tanggal = document.getElementById("tanggal").value;
  let temuan = document.getElementById("temuan").value;
  let tindak = document.getElementById("tindak").value;
  let target = document.getElementById("target").value;

  if (!radiografer || !tanggal) { alert("Nama radiografer dan tanggal wajib diisi."); return; }

  let chk = document.querySelectorAll(".chk");
  let total = chk.length;
  let patuh = 0;
  chk.forEach(c => { if (c.checked) patuh++; });
  let persen = ((patuh / total) * 100).toFixed(2);

  db.ref("audit/" + jenis).push({
    nama: "Ino Hadiwinata, A.Md.Rad",
    radiografer, unit, tanggal, total, patuh,
    persentase: persen, temuan,
    tindak_lanjut: tindak, target,
    status: "Tervalidasi",
    verifikator: "dr. Amelia Rusli A, Sp.Rad",
    timestamp: Date.now()
  });

  alert("✅ Audit tersimpan dan terverifikasi.");
  navClick('dashboard', showDashboard);
}

var JENIS_LABEL = { hand:'Hand Hygiene', identifikasi:'Identifikasi Pasien', apd:'APD Radiologi', thorax:'Mutu Foto Thorax' };
var JENIS_COLOR = { hand:'#2a9d8f', identifikasi:'#e07b39', apd:'#4a6375', thorax:'#e63946' };

function loadData() {
  let dataPersen = [];
  let dataLabel = [];
  let ranking = {};
  let jenisCount = {};
  let recentItems = [];
  let today = new Date().toISOString().split("T")[0];
  let adaHariIni = false;
  let totalAudit = 0;
  let sumPersen = 0;
  let bawahTarget = 0;
  let filter = document.getElementById("filterRadiografer")?.value || "";

  db.ref("audit").once("value", snap => {
    if (!snap.exists()) {
      document.getElementById("dataList").innerHTML = "<p style='color:var(--text-muted);font-size:13px'>Belum ada data audit.</p>";
      document.getElementById("legendJenis").innerHTML = "";
      return;
    }

    let radiograferSet = new Set();

    snap.forEach(jenis => {
      jenis.forEach(item => {
        let d = item.val();
        radiograferSet.add(d.radiografer || "-");
        if (filter && d.radiografer !== filter) return;

        if (d.tanggal === today) adaHariIni = true;

        let p = parseFloat(d.persentase);
        dataPersen.push(p);
        dataLabel.push(d.tanggal);
        sumPersen += p;
        totalAudit++;
        if (p < 85) bawahTarget++;

        jenisCount[jenis.key] = (jenisCount[jenis.key] || 0) + 1;

        if (!ranking[d.radiografer]) ranking[d.radiografer] = { total: 0, jumlah: 0 };
        ranking[d.radiografer].total += p;
        ranking[d.radiografer].jumlah++;

        recentItems.push({ jenis: jenis.key, data: d, ts: d.timestamp || 0 });
      });
    });

    // Update stats
    document.getElementById("statTotal").textContent = totalAudit;
    document.getElementById("statAvg").textContent = totalAudit ? (sumPersen / totalAudit).toFixed(1) + "%" : "—";
    document.getElementById("statHariIni").textContent = dataPersen.filter((_, i) => dataLabel[i] === today).length;
    document.getElementById("statBawah").textContent = bawahTarget;

    // Reminder
    document.getElementById("reminderArea").innerHTML = adaHariIni ? "" :
      '<div class="reminder-banner">⚠ Belum ada data audit yang diinput hari ini (' + today + ')</div>';

    // Dropdown
    let select = document.getElementById("filterRadiografer");
    if (select) {
      let currentVal = select.value;
      select.innerHTML = '<option value="">Semua Radiografer</option>';
      radiograferSet.forEach(r => {
        select.innerHTML += `<option value="${r}" ${r === currentVal ? 'selected' : ''}>${r}</option>`;
      });
    }

    // Riwayat terbaru (5 teratas berdasarkan waktu input)
    recentItems.sort((a, b) => b.ts - a.ts);
    let recentHTML = recentItems.slice(0, 5).map(it => {
      let d = it.data;
      let encoded = encodeURIComponent(JSON.stringify(d));
      return `
      <div class="audit-item">
        <div class="audit-item-header">
          <span class="audit-type-badge">${JENIS_LABEL[it.jenis] || it.jenis}</span>
          ${badge(d.persentase)}
        </div>
        <div class="audit-meta">
          👤 <strong>${d.radiografer || "-"}</strong> &nbsp;·&nbsp; 📅 ${d.tanggal} &nbsp;·&nbsp; 🏥 ${d.unit || "-"}
        </div>
        <button class="btn-cetak" onclick="cetakAudit('${encoded}')">🖨 Cetak Lembar Audit</button>
      </div>`;
    }).join('');
    document.getElementById("dataList").innerHTML = recentHTML || "<p style='color:var(--text-muted);font-size:13px'>Tidak ada data untuk filter ini.</p>";

    // Chart Tren
    if (chartInstance) chartInstance.destroy();
    chartInstance = new Chart(document.getElementById("chart"), {
      type: "line",
      data: {
        labels: dataLabel,
        datasets: [{
          label: "Kepatuhan (%)",
          data: dataPersen,
          borderColor: "#2a9d8f",
          backgroundColor: "rgba(42,157,143,0.10)",
          tension: 0.4,
          fill: true,
          pointBackgroundColor: "#2a9d8f",
          pointRadius: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { min: 0, max: 100, grid: { color: "#eef2f5" }, ticks: { callback: v => v + "%" } },
          x: { grid: { display: false } }
        }
      }
    });

    // Chart Distribusi Jenis (doughnut)
    let jenisKeys = Object.keys(JENIS_LABEL).filter(k => jenisCount[k]);
    let jenisData = jenisKeys.map(k => jenisCount[k]);
    let jenisColors = jenisKeys.map(k => JENIS_COLOR[k]);
    if (chartJenisInstance) chartJenisInstance.destroy();
    let canvasJenis = document.getElementById("chartJenis");
    if (canvasJenis) {
      chartJenisInstance = new Chart(canvasJenis, {
        type: "doughnut",
        data: {
          labels: jenisKeys.map(k => JENIS_LABEL[k]),
          datasets: [{ data: jenisData, backgroundColor: jenisColors, borderWidth: 2, borderColor: "#fff" }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: "68%",
          plugins: { legend: { display: false } }
        }
      });
    }
    let legendHTML = jenisKeys.map((k, i) => `
      <div class="legend-item">
        <span class="legend-dot" style="background:${jenisColors[i]}"></span>
        <span class="legend-name">${JENIS_LABEL[k]}</span>
        <span class="legend-val">${jenisData[i]}</span>
      </div>`).join('');
    document.getElementById("legendJenis").innerHTML = legendHTML || "<p style='color:var(--text-muted);font-size:13px'>Belum ada data.</p>";

    // Ranking
    let rankingArray = [];
    for (let r in ranking) {
      let rata = (ranking[r].total / ranking[r].jumlah).toFixed(2);
      rankingArray.push({ nama: r, rata: parseFloat(rata) });
    }
    rankingArray.sort((a, b) => b.rata - a.rata);
    let medals = ["🥇","🥈","🥉"];
    let rankingHTML = rankingArray.map((r, i) => `
      <div class="ranking-item">
        <span class="ranking-medal">${medals[i] || (i+1)+"."}</span>
        <span class="ranking-name">${r.nama}</span>
        ${badge(r.rata)}
      </div>`).join('');
    document.getElementById("rankingList").innerHTML = rankingHTML || "<p style='color:var(--text-muted);font-size:13px'>Belum ada data.</p>";
  });
}

/* ══════════════════════════════════════════════

var ARSIP_ALL = [];
var ARSIP_FILTERED = [];
var ARSIP_PAGE = 1;
var ARSIP_PER_PAGE = 10;

function showArsip(preset) {
  document.getElementById("mainContent").innerHTML = `
  <div class="page-header">
    <h1>🗂️ Arsip Laporan Audit</h1>
    <p>Riwayat lengkap seluruh data audit mutu — cari, filter, dan cetak ulang</p>
  </div>

  <div class="card">
    <div class="arsip-toolbar">
      <div class="form-group">
        <label>Cari (nama / unit)</label>
        <input type="text" id="arsipSearch" placeholder="Ketik nama radiografer atau unit..." oninput="applyArsipFilters()">
      </div>
      <div class="form-group">
        <label>Jenis Audit</label>
        <select id="arsipJenis" onchange="applyArsipFilters()">
          <option value="">Semua Jenis</option>
          <option value="hand">Hand Hygiene</option>
          <option value="identifikasi">Identifikasi Pasien</option>
          <option value="apd">APD Radiologi</option>

        </select>
      </div>
      <div class="form-group">
        <label>Dari Tanggal</label>
        <input type="date" id="arsipDari" onchange="applyArsipFilters()">
      </div>
      <div class="form-group">
        <label>Sampai Tanggal</label>
        <input type="date" id="arsipSampai" onchange="applyArsipFilters()">
      </div>
      <button class="btn-outline" onclick="resetArsipFilters()">↺ Reset</button>
    </div>

    <div class="arsip-summary-row" id="arsipSummary"></div>

    <div class="arsip-table-wrap">
      <table class="arsip-table">
        <thead>
          <tr>
            <th>Tanggal</th>
            <th>Jenis Audit</th>
            <th>Radiografer</th>
            <th>Unit</th>
            <th>Kepatuhan</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="arsipTableBody">
          <tr><td colspan="7" class="arsip-empty">Memuat data arsip...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="arsip-pagination" id="arsipPagination"></div>
  </div>
  `;
  loadArsipData(preset);
}

function loadArsipData(preset) {
  db.ref("audit").once("value", snap => {
    ARSIP_ALL = [];
    if (snap.exists()) {
      snap.forEach(jenisSnap => {
        jenisSnap.forEach(item => {
          let d = item.val();
          ARSIP_ALL.push({ jenis: jenisSnap.key, key: item.key, data: d });
        });
      });
    }
    ARSIP_ALL.sort((a, b) => (b.data.timestamp || 0) - (a.data.timestamp || 0));

    if (preset && preset.bawah) {
      // Tandai filter cepat: tampilkan hanya yang di bawah target lewat pencarian gabungan
      ARSIP_FILTERED = ARSIP_ALL.filter(it => parseFloat(it.data.persentase) < 85);
      ARSIP_PAGE = 1;
      renderArsipSummary(true);
      renderArsipTable();
      renderArsipPagination();
    } else {
      applyArsipFilters();
    }
  });
}

function resetArsipFilters() {
  document.getElementById("arsipSearch").value = "";
  document.getElementById("arsipJenis").value = "";
  document.getElementById("arsipDari").value = "";
  document.getElementById("arsipSampai").value = "";
  applyArsipFilters();
}

function applyArsipFilters() {
  let search = (document.getElementById("arsipSearch")?.value || "").toLowerCase().trim();
  let jenisF = document.getElementById("arsipJenis")?.value || "";
  let dari = document.getElementById("arsipDari")?.value || "";
  let sampai = document.getElementById("arsipSampai")?.value || "";

  ARSIP_FILTERED = ARSIP_ALL.filter(it => {
    let d = it.data;
    if (jenisF && it.jenis !== jenisF) return false;
    if (dari && d.tanggal < dari) return false;
    if (sampai && d.tanggal > sampai) return false;
    if (search) {
      let hay = ((d.radiografer || "") + " " + (d.unit || "")).toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  ARSIP_PAGE = 1;
  renderArsipSummary(false);
  renderArsipTable();
  renderArsipPagination();
}

function renderArsipSummary(isBawahPreset) {
  let total = ARSIP_FILTERED.length;
  let sum = 0, bawah = 0;
  ARSIP_FILTERED.forEach(it => {
    let p = parseFloat(it.data.persentase);
    sum += p;
    if (p < 85) bawah++;
  });
  let rata = total ? (sum / total).toFixed(1) : "0";
  let el = document.getElementById("arsipSummary");
  if (!el) return;
  el.innerHTML = `
    <div class="arsip-chip">📄 Total Data: <strong>${total}</strong></div>
    <div class="arsip-chip">✅ Rata-rata Kepatuhan: <strong>${rata}%</strong></div>
    <div class="arsip-chip">⚠️ Di Bawah Target: <strong>${bawah}</strong></div>
    ${isBawahPreset ? '<div class="arsip-chip">🔎 Menampilkan hanya kepatuhan &lt; 85%</div>' : ''}
  `;
}

function renderArsipTable() {
  let tbody = document.getElementById("arsipTableBody");
  if (!tbody) return;
  let start = (ARSIP_PAGE - 1) * ARSIP_PER_PAGE;
  let pageItems = ARSIP_FILTERED.slice(start, start + ARSIP_PER_PAGE);

  if (!pageItems.length) {
    tbody.innerHTML = `<tr><td colspan="7" class="arsip-empty">Tidak ada data audit yang cocok dengan filter.</td></tr>`;
    return;
  }

  tbody.innerHTML = pageItems.map(it => {
    let d = it.data;
    let encoded = encodeURIComponent(JSON.stringify(d));
    return `
    <tr>
      <td>${d.tanggal || "-"}</td>
      <td><span class="audit-type-badge">${JENIS_LABEL[it.jenis] || it.jenis}</span></td>
      <td>${d.radiografer || "-"}</td>
      <td>${d.unit || "-"}</td>
      <td>${badge(d.persentase)}</td>
      <td>${d.status || "-"}</td>
      <td>
        <button class="mini-btn" onclick="cetakAudit('${encoded}')">🖨 Cetak</button>
        <button class="mini-btn danger" onclick="hapusArsip('${it.jenis}','${it.key}')">🗑 Hapus</button>
      </td>
    </tr>`;
  }).join('');
}

function renderArsipPagination() {
  let el = document.getElementById("arsipPagination");
  if (!el) return;
  let totalPages = Math.max(1, Math.ceil(ARSIP_FILTERED.length / ARSIP_PER_PAGE));
  if (ARSIP_PAGE > totalPages) ARSIP_PAGE = totalPages;

  let html = `<button ${ARSIP_PAGE <= 1 ? 'disabled' : ''} onclick="goArsipPage(${ARSIP_PAGE - 1})">‹ Sebelumnya</button>`;
  html += `<span class="arsip-page-info">Halaman ${ARSIP_PAGE} dari ${totalPages}</span>`;
  html += `<button ${ARSIP_PAGE >= totalPages ? 'disabled' : ''} onclick="goArsipPage(${ARSIP_PAGE + 1})">Berikutnya ›</button>`;
  el.innerHTML = html;
}

function goArsipPage(n) {
  ARSIP_PAGE = n;
  renderArsipTable();
  renderArsipPagination();
}

function hapusArsip(jenis, key) {
  if (!confirm("Hapus data audit ini dari arsip? Tindakan ini tidak dapat dibatalkan.")) return;
  db.ref("audit/" + jenis + "/" + key).remove().then(() => {
    ARSIP_ALL = ARSIP_ALL.filter(it => !(it.jenis === jenis && it.key === key));
    applyArsipFilters();
  });
}
